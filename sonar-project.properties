# -----------------------------------------------------------------------------
# SonarQube Project Configuration: Cafe ERP Management System
# -----------------------------------------------------------------------------

# 1. Project Identification
sonar.projectKey=cafe-erp-system
sonar.projectName=Cafe ERP Management System
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# 2. Source Code & Monorepo Structure
# Includes both Go Backend and Vue 3 Frontend
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,backend/pkg
sonar.test.inclusions=**/*_test.go,**/*.spec.ts,**/*.test.ts

# 3. Exclusions (Third-party, Generated files, Assets, Documentation)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/vendor/**,\
  **/.git/**,\
  **/doc/**,\
  **/*.docx,\
  **/*.png,\
  **/*.jpg,\
  **/*.ico,\
  **/*.svg,\
  **/*.log,\
  **/.vscode/**,\
  **/.system_generated/**,\
  **/coverage*,\
  backend/migrations/**,\
  backend/cmd/**

# 4. Coverage Exclusions (Don't calculate code coverage on tests, tools, or mocks)
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/*.spec.ts,\
  **/tests/**,\
  **/cmd/**,\
  **/scripts/**,\
  backend/internal/config/**

# 5. Go Language Test & Coverage Settings
sonar.go.coverage.reportPaths=backend/coverage.out

# 6. JavaScript / TypeScript Settings
sonar.typescript.tsconfigPath=frontend/tsconfig.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# 7. Quality Gate Behavior
# Wait for the SonarQube server to calculate Quality Gate status and return non-zero exit code if failed
sonar.qualitygate.wait=true
