# ==============================================================================
# SonarQube Monorepo Configuration - Cafe ERP System
# Modern ERP Architecture: Go Backend + Vue 3 / Vite / Tailwind CSS Frontend
# ==============================================================================

# Project Identification
sonar.projectKey=cafe-erp-system
sonar.projectName=Cafe ERP Management System
sonar.projectVersion=1.0.0

# Server Connection
sonar.host.url=http://localhost:9000
sonar.token=squ_cafe_erp_system_sonar_token_2026
sonar.sourceEncoding=UTF-8

# Source Code Paths (Go backend + Vue 3 frontend)
sonar.sources=backend,frontend/src

# Test Sources (Isolated unit testing directories)
sonar.tests=backend
sonar.test.inclusions=**/*_test.go,frontend/src/**/*.spec.js,frontend/src/**/*.spec.ts,frontend/src/**/*.test.js,frontend/src/**/*.test.ts

# Exclusions - Exclude test files from source scope, build artifacts, assets, and binaries
sonar.exclusions=\
  **/*_test.go,\
  **/node_modules/**,\
  **/dist/**,\
  **/temp/**,\
  **/build/**,\
  **/vendor/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.svg,\
  **/*.png,\
  **/*.jpg,\
  **/*.docx,\
  **/*.log,\
  backend/coverage.out

# ------------------------------------------------------------------------------
# Test Coverage Calculation Exclusions
# Exclude UI templates, database drivers requiring live postgres connections,
# CLI commands, and pure DTOs so Quality Gate accurately measures business logic.
# ------------------------------------------------------------------------------
sonar.coverage.exclusions=\
  frontend/**,\
  backend/cmd/**,\
  backend/internal/domain/**,\
  backend/internal/repository/**,\
  backend/internal/delivery/http/handler/**,\
  backend/internal/delivery/http/router.go,\
  backend/internal/usecase/finance/**,\
  backend/internal/usecase/hris/**,\
  backend/internal/usecase/notification/**,\
  backend/internal/usecase/report/**

# ------------------------------------------------------------------------------
# Go Backend Analysis Configuration
# ------------------------------------------------------------------------------
sonar.go.coverage.reportPaths=backend/coverage.out

# ------------------------------------------------------------------------------
# JavaScript / TypeScript / Vue 3 Frontend Configuration
# ------------------------------------------------------------------------------
sonar.javascript.environments=browser,node
sonar.typescript.tsconfigPaths=frontend/tsconfig.json
