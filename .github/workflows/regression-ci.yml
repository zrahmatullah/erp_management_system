name: Cafe ERP - Regression & CI Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  regression-testing:
    name: Full Regression Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cafe_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Database Migrations
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: password
          DB_DATABASE: cafe_erp
        run: go run -buildvcs=false ./cmd/migrate/main.go

      - name: Start Backend Server Daemon
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: password
          DB_DATABASE: cafe_erp
          PORT: 8080
          ENV: test
          JWT_SECRET: super-secret-cafe-erp-jwt-key-2026
        run: |
          go run -buildvcs=false ./cmd/server/main.go &
          # Wait up to 30s for health endpoint to become ready
          for i in {1..30}; do
            if curl -s http://localhost:8080/health | grep -q "healthy"; then
              echo "✅ Backend server is healthy and ready"
              break
            fi
            echo "Waiting for backend server to spin up ($i/30)..."
            sleep 1
          done

      - name: Stage 1 - Smoke & Sanity Testing
        working-directory: ./backend
        env:
          API_BASE_URL: http://localhost:8080
        run: go test -count=1 -v ./tests/smoke/...

      - name: Stage 2 - Backend Unit Testing
        working-directory: ./backend
        run: go test -count=1 -v ./pkg/crypto/...

      - name: Stage 3 - Backend Integration Testing
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: password
          DB_DATABASE: cafe_erp
          API_BASE_URL: http://localhost:8080
        run: go test -count=1 -v ./tests/integration/...

      - name: Stage 4 - Backend End-to-End (E2E) Scenario Testing
        working-directory: ./backend
        env:
          API_BASE_URL: http://localhost:8080
        run: go test -count=1 -v ./tests/e2e/...

      - name: Stage 5 - Frontend TypeScript Typecheck & Build
        working-directory: ./frontend
        run: |
          npx vue-tsc --noEmit
          npm run build

      - name: Regression Pipeline Success
        run: echo "🎉 All regression tests passed successfully! Pull request is safe to merge."

