name: SonarQube Code Quality & Security Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  sonarqube:
    name: SonarQube Analysis & Quality Gate Enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for accurate blame and changed-line metrics

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Unit Tests & Generate Coverage
        working-directory: backend
        run: |
          go test -v -coverprofile=coverage.out -coverpkg=./... ./tests/unit

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Lint Check
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=cafe-erp-system
            -Dsonar.go.coverage.reportPaths=backend/coverage.out

      # Quality Gate Check: Breaks CI/CD build if Quality Gate conditions are not satisfied
      # Requirements:
      # - Coverage >= 75%
      # - Critical Vulnerabilities = 0
      # - Security Hotspots Reviewed = 100%
      # - Hardcoded Secrets = 0
      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
