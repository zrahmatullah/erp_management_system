# Upstream pools for Docker Compose network
upstream backend_core {
    server backend-core-1:8081;
    server backend-core-2:8082;
    keepalive 32;
}

upstream backend_heavy {
    least_conn;
    server backend-heavy:8083;
    keepalive 16;
}

server {
    listen 8080;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_cache_bypass $http_upgrade;

    # 1. Heavy API Route (Reports, Payroll Run, Opnames, Stock Movements, Reconciliation)
    location ~* ^/api/v1/(reports|hris/payrolls/run|hris/payrolls/batch-approve|inventory/opnames|inventory/stock-movements|finance/reconciliation/match) {
        proxy_pass http://backend_heavy;
        add_header X-Load-Balancer-Route "HEAVY-POOL" always;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 2. Real-Time & Light API Route (POS, KDS, Auth, Master)
    location /api/v1/ {
        proxy_pass http://backend_core;
        add_header X-Load-Balancer-Route "CORE-POOL" always;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
    }

    # 3. Health check
    location /health {
        proxy_pass http://backend_core/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location /lb-status {
        default_type application/json;
        return 200 '{"status":"active","load_balancer":"nginx-layer7","mode":"docker-cluster"}';
    }
}
