# ==============================================================================
# Nginx Layer-7 Smart Load Balancer Configuration for Cafe ERP System
# ==============================================================================
# Arsitektur:
# - backend_core  (8081, 8082): Melayani request real-time POS, KDS, Auth, Master CRUD.
# - backend_heavy (8083, 8084): Melayani agregasi laporan, kalkulasi payroll, opname, rekonsiliasi.
# ==============================================================================

# Pool untuk API Real-Time & Operasional Cepat (POS, KDS, Auth, Master)
upstream backend_core {
    # Round-Robin / IP-Hash untuk transaksi cepat
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Pool untuk API Beban Berat & Batch Processing (Laporan, Payroll Run, Stok Opname)
upstream backend_heavy {
    # Least-Connection: Mendistribusikan ke worker dengan antrean komputasi terendah
    least_conn;
    server 127.0.0.1:8083 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8084 max_fails=3 fail_timeout=10s backup;
    keepalive 16;
}

server {
    listen 8080;
    server_name localhost;

    # Gzip Compression untuk menghemat bandwidth
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Shared Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_cache_bypass $http_upgrade;

    # --------------------------------------------------------------------------
    # 1. Routing API Berat (Reports, Batch Payroll, Opname, Rekonsiliasi Bank)
    # --------------------------------------------------------------------------
    location ~* ^/api/v1/(reports|hris/payrolls/run|hris/payrolls/batch-approve|inventory/opnames|inventory/stock-movements|finance/reconciliation/match) {
        proxy_pass http://backend_heavy;
        add_header X-Load-Balancer-Route "HEAVY-POOL" always;

        # Timeout panjang untuk kalkulasi agregasi data ribuan baris
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Buffer besar untuk payload laporan JSON / PDF
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --------------------------------------------------------------------------
    # 2. Routing API Standar & Real-Time (POS Order, KDS Kitchen, Auth, Master)
    # --------------------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://backend_core;
        add_header X-Load-Balancer-Route "CORE-POOL" always;

        # Timeout ketat agar transaksi POS/KDS tidak menggantung
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        # Buffer standar
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
    }

    # --------------------------------------------------------------------------
    # 3. Global Health Check & LB Diagnostics
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://backend_core/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location /lb-status {
        default_type application/json;
        return 200 '{"status":"active","load_balancer":"nginx-layer7","mode":"dual-pool"}';
    }
}
