# ==============================================================================
# SonarQube Frontend Configuration - Cafe ERP System (Vue 3 / TypeScript)
# ==============================================================================

sonar.projectKey=cafe-erp-frontend
sonar.projectName=Cafe ERP - Frontend (Vue 3)
sonar.projectVersion=1.0.0

sonar.host.url=http://localhost:9000
sonar.token=squ_cafe_erp_system_sonar_token_2026
sonar.sourceEncoding=UTF-8

# Source Code & Tests
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts,tests/**/*.test.ts,src/**/*.spec.ts,src/**/*.test.ts

# General Exclusions (Assets, build output, styles)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.d.ts,\
  src/assets/**,\
  src/vite-env.d.ts

# Test Coverage Exclusions
# Exclude raw page views (E2E testing scope), container overlays, and app entry points
# so Quality Gate accurately measures core business logic (stores, composables, formatters, guards, components)
sonar.coverage.exclusions=\
  src/views/**,\
  src/components/layout/**,\
  src/components/common/*Container.vue,\
  src/router/index.ts,\
  src/plugins/**,\
  src/main.ts,\
  src/App.vue,\
  src/vite-env.d.ts,\
  src/types/**

# Coverage Report Path (LCOV generated by Vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
